 </head>
 <body>
	
	<div class="container">
		<div class="row">
		
			<!--Left Track-->
			<div class="L-track">
				<img src="img/KFI.gif" class="headerimg">
				<h2>Welcome,<br>Valued Customer</h2>
					<a style="color:#010124" href="index.html" class="BT">Home</a><br>
					<a style="color:#010124" href="games.html" class="BT">Games</a><br>
					<a style="color:#010124" href="music.html" class="BT">Arts</a><br>
					<a style="color:#010124" href="work.html" class="BT">Funks</a><br>
					<a style="color:#010124" href="https://github.com/KoasterFunk/Koasterfunk_Org" class="BTB">GitHub</a><br>
					<a style="color:#010124" href="img/blueffy.webp" class="BTB">Blueffy</a><br>
				<footer>
				<h5>Contact Me</h5>
				<h6>Discord: @Koaster</h6>
				<h6>Steam: <a href="https://steamcommunity.com/id/SteampunkSkunk/">KoasterFunk</a></h6>
				<h6>Email: KoasterFunk@gmail.com</h6>
				</footer>
				
				
			</div>
			
				<!--Right Track-->
				<div class="R-track">
					<img class="headerimgR" src="img/MakeThings.png">
					<div class="R-Space">
						<div>
							<h2>The Poster-Funk</h2>
							<select class="DP" id="fselect" name="fselect">
								<option value="">--Funk Select--</option>
							</select>
							<br>
							<div class="Funks">
								<object id="funk-frame" data="Funks/Default/Default.html" class="FunkFrame" ></object>
							</div>
						
							<script>
								const select = document.getElementById('fselect')
								const frame = document.getElementById('funk-frame')
							
								fetch('../Funks/Funks.json')
									.then(response => response.json())
									.then(files => {
								
										files.forEach(filename => {
											const option = document.createElement('option');
											option.value = '../Funks/' + filename;
											option.textContent = filename;
											option.textContent = filename
												.replace('.html','')
												.replace(/-/g, ' ');
											select.appendChild(option);
										});
									});
								
								select.addEventListener('change', () => {
									frame.data = select.value;
								});
							</script>
						</div>	
					</div>
				
				</div>
		</div>
	</div>
	
	
	<div class="container">
		<div class="row">
			
		</div>
	</div>
 </body>
